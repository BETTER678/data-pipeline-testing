[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    unit: isolated unit test
    integration: multi-module pipeline/database test
    data_quality: validation, quarantine and edge-case test
    regression: fixed expected-output or determinism test
    edge_case: one of the numbered required edge cases (EC-01..EC-18)
    domain: e-commerce domain business rule
    slow: benchmark-scale or long-running test
filterwarnings =
    ignore::DeprecationWarning:pandera.*
